name: Relay external host smoke

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue that receives the ephemeral room code
        required: true
        default: "3"
      duration_seconds:
        description: Relay soak duration
        required: true
        default: "600"

permissions:
  contents: read
  issues: write

jobs:
  host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download temporary Windows diagnostic build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download relay-smoke-build --repo $env:GITHUB_REPOSITORY --pattern CockroachFantasia-Windows.zip --dir $env:RUNNER_TEMP
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\CockroachFantasia-Windows.zip" -DestinationPath "$env:RUNNER_TEMP\CockroachFantasia"

      - name: Host Relay diagnostic
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          $exe = "$env:RUNNER_TEMP\CockroachFantasia\CockroachFantasia.exe"
          $codePath = "$env:RUNNER_TEMP\relay-room.txt"
          $logPath = "$env:RUNNER_TEMP\relay-external-host.log"
          $arguments = "-batchmode -nographics -playerProfile relay-external-$env:GITHUB_RUN_ID -relayHostSmoke -roomCodeFile $codePath -relayDurationSeconds $env:DURATION_SECONDS -relayPostSuccessHoldSeconds 0 -logFile $logPath"
          $player = Start-Process -FilePath $exe -ArgumentList $arguments -WindowStyle Hidden -PassThru

          $deadline = (Get-Date).AddSeconds(90)
          while (!(Test-Path -LiteralPath $codePath) -and (Get-Date) -lt $deadline -and !$player.HasExited) {
            Start-Sleep -Milliseconds 500
            $player.Refresh()
          }

          if (!(Test-Path -LiteralPath $codePath)) {
            if (!$player.HasExited) { Stop-Process -Id $player.Id -Force }
            Get-Content -LiteralPath $logPath
            throw "The external host did not publish a room code."
          }

          $roomCode = (Get-Content -LiteralPath $codePath -Raw).Trim()
          gh issue comment $env:ISSUE_NUMBER --repo $env:GITHUB_REPOSITORY --body "RELAY_EXTERNAL_HOST_READY run=$env:GITHUB_RUN_ID code=$roomCode"
          Wait-Process -Id $player.Id -Timeout ([int]$env:DURATION_SECONDS + 180)
          $player.Refresh()
          Get-Content -LiteralPath $logPath

          if ($player.ExitCode -ne 0) {
            throw "Relay host exited with code $($player.ExitCode)."
          }

          if (!(Select-String -LiteralPath $logPath -Pattern "RELAY_DIAGNOSTIC_SUCCESS role=host" -Quiet)) {
            throw "Relay host did not emit its success marker."
          }

      - name: Upload host log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-external-host-log
          path: ${{ runner.temp }}\relay-external-host.log
          if-no-files-found: warn
